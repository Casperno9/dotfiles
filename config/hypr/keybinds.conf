$mod = SUPER

# Applications
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, thunar

# Fenêtres
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod SHIFT, E, exit

# Focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Workspaces 1 à 5 (touches & é " ' ( en AZERTY, via keycodes 10 à 14)
bind = $mod, 10, workspace, 1
bind = $mod, 11, workspace, 2
bind = $mod, 12, workspace, 3
bind = $mod, 13, workspace, 4
bind = $mod, 14, workspace, 5
bind = $mod SHIFT, 10, movetoworkspace, 1
bind = $mod SHIFT, 11, movetoworkspace, 2
bind = $mod SHIFT, 12, movetoworkspace, 3
bind = $mod SHIFT, 13, movetoworkspace, 4
bind = $mod SHIFT, 14, movetoworkspace, 5

# Souris
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Fond d'écran suivant
bind = $mod, W, exec, ~/.config/scripts/wallpaper.sh next

# Captures d'écran
bind = , Print, exec, ~/.config/scripts/screenshot.sh area
bind = SHIFT, Print, exec, ~/.config/scripts/screenshot.sh full

# Audio / luminosité / média
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl  = , XF86AudioMute, exec, pamixer -t
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
