# Hyprland — configuration légère (Arch Linux, clavier AZERTY)

monitor = , preferred, auto, 1

$terminal = kitty
$menu = wofi --show drun

# Démarrage
exec-once = ~/.config/scripts/wallpaper.sh
exec-once = waybar
exec-once = mako

env = XCURSOR_SIZE,24

input {
    kb_layout = fr
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 4, ease, slide
    animation = fade, 1, 4, ease
    animation = workspaces, 1, 4, ease, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

source = ~/.config/hypr/keybinds.conf
