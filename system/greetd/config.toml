[terminal]
vt = 1

[default_session]
command = "tuigreet --time --time-format '%H:%M' --greeting 'bienvenue' --asterisks --remember --remember-user-session --window-padding 2 --container-padding 2 --prompt-padding 1 --theme 'border=magenta;text=white;prompt=lightmagenta;time=gray;action=gray;button=lightmagenta;container=black;input=white' --cmd Hyprland"
user = "greeter"
